name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/api
      - run: npm run test:coverage -w apps/api
      - run: npm run build -w apps/api
      - name: OpenAPI document matches the code
        run: npm run openapi -w apps/api && git diff --exit-code docs/openapi.json
      - run: npm audit --workspace apps/api --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w apps/web
      - run: npm test -w apps/web

  container-scan:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t ereceipt-api:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: ereceipt-api:ci, severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: true }

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start API (in-memory MongoDB, demo data, simulated ETA)
        run: (npm run dev:memory -w apps/api > api.log 2>&1 &) && npx --yes wait-on@8.0.3 -t 180000 http://localhost:3000/health/ready
      - name: Start web app
        run: (npm start -w apps/web > web.log 2>&1 &) && npx --yes wait-on@8.0.3 -t 180000 http://localhost:4200
      - run: SHOTS_DIR=e2e/shots CHROME_BIN=google-chrome npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-artifacts, path: "e2e/shots\napi.log\nweb.log" }
