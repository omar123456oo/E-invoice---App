name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/api
      - run: npm test -w apps/api
      - run: npm run build -w apps/api
      - run: npm audit --workspace apps/api --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w apps/web
      - run: npm test -w apps/web

  container-scan:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t ereceipt-api:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: ereceipt-api:ci, severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: true }
